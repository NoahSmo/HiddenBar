name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: HiddenBar
          path: build/HiddenBar-*.zip
